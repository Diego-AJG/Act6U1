<ion-header>
  <ion-toolbar>
    <ion-title>Calculadora de Potencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Base</ion-label>
    <ion-input type="number" [(ngModel)]="base"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Exponente</ion-label>
    <ion-input type="number" [(ngModel)]="exponente"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="calcularPotencia()">Calcular</ion-button>

  <ion-card *ngIf="resultado !== null">
    <ion-card-header>
      <ion-card-title>Resultado</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      {{ base }}^{{ exponente }} = {{ resultado }}
    </ion-card-content>
  </ion-card>

  <ion-card-content>
    <p><strong>Nombre:</strong>Rubi Ruiz Ibarra </p>
    <p><strong>Docente:</strong>Prof.David Hernández Chessani</p>
  </ion-card-content>
</ion-content>
